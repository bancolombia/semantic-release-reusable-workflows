name: Load-properties-of-repository

on:
  workflow_call:
    outputs:
      SEMREL_MODE:
        description: "The value of the SEMREL_MODE property from the repository properties."
        value: ${{ jobs.load_properties_repository.outputs.SEMREL_MODE }}
      SEMREL_VERSION:
        description: "The value of the SEMREL_VERSION property from the repository properties."
        value: ${{ jobs.load_properties_repository.outputs.SEMREL_VERSION }}
# permissions:
#   contents: read # for checkout

jobs:
  load_properties_repository:
    name: Load properties of repository
    runs-on:
      group: Temporal-Github
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    outputs:
      SEMREL_MODE: ${{ steps.set_output.outputs.SEMREL_MODE }}
      SEMREL_VERSION: ${{ steps.set_output.outputs.SEMREL_VERSION }}
    steps:
      - name: Generate a token of Github APP
        id: generate_token
        uses: actions/create-github-app-token@v2.2.0
        with:
          app-id: ${{ secrets.APP_ID_TOOLKIT_INNERSOURCE }}
          private-key: ${{ secrets.APP_PRIVATEKEY_TOOLKIT_INNERSOURCE }}
          owner: ${{ github.repository_owner }}
      - name: Set token for GitHub CLI
        run: echo "GITHUB_TOKEN=${{ steps.generate_token.outputs.token }}" >> $GITHUB_ENV 
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
        with:
          fetch-tags: 'true'
          token: ${{ steps.generate_token.outputs.token }}
      - name: Load properties of repository
        id: load_properties
        run: |
          gh api -H "Accept: application/vnd.github+json" \
           -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/properties/values --jq '.[] | "\(.property_name | ascii_upcase)=\(.value)"' \
            >> $GITHUB_ENV
      - name: Set output variable 
        id: set_output
        run: |
          echo "SEMREL_MODE=$SEMREL_MODE" >> $GITHUB_OUTPUT
          echo "SEMREL_VERSION=$SEMREL_VERSION" >> $GITHUB_OUTPUT